name: CI

on:
  push:
    branches:
      - main
      - codex/windows-compat
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      - name: Test
        shell: pwsh
        run: |
          cargo test --all-features *>&1 | Tee-Object -FilePath test.log
          exit $LASTEXITCODE
      - name: Upload Windows test diagnostics
        if: failure() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-log
          path: test.log
      - name: Release build
        run: cargo build --release
