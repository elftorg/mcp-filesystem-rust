name: CI

on:
  push:
    branches:
      - main
      - codex/windows-compat
  pull_request:

permissions:
  contents: write

jobs:
  apply-direct-fix:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/windows-compat
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch platform-specific source directly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected source fragment not found in {path}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/actions/files.rs",
              '    let permissions = format!("{:o}", cap_meta.permissions().mode() & 0o777);',
              '''    #[cfg(unix)]
          let permissions = Some(format!("{:o}", cap_meta.permissions().mode() & 0o777));
          #[cfg(not(unix))]
          let permissions: Option<String> = None;''',
          )

          replace_once(
              "src/actions/files.rs",
              '''pub async fn set_permissions(args: Option<&Value>, config: &Config) -> Result<Value> {
              let path = get_str_arg(args, "path")?;
              let mode_str = get_str_arg(args, "mode")?;
              let resolved = config.sandbox().resolve(&path)?;

              let mode = u32::from_str_radix(&mode_str, 8).map_err(|_| {
                  MCSError::InvalidParams(format!(
                      "Invalid mode: {mode_str}. Use octal format (e.g. 644, 755)"
                  ))
              })?;

              #[cfg(unix)]
              {
                  use cap_std::fs::PermissionsExt;
                  let perm = cap_std::fs::Permissions::from_mode(mode);
                  resolved.set_permissions(perm).await?;
              }

              #[cfg(not(unix))]
              {
                  let _ = (mode, &resolved);
                  return Err(MCSError::FilesystemError(
                      "Permission changes are not supported on this platform".into(),
                  ));
              }

              Ok(json!({ "success": true, "path": resolved.canonical.to_string_lossy(), "mode": mode_str }))
          }''',
              '''pub async fn set_permissions(args: Option<&Value>, config: &Config) -> Result<Value> {
              #[cfg(unix)]
              {
                  let path = get_str_arg(args, "path")?;
                  let mode_str = get_str_arg(args, "mode")?;
                  let resolved = config.sandbox().resolve(&path)?;
                  let mode = u32::from_str_radix(&mode_str, 8).map_err(|_| {
                      MCSError::InvalidParams(format!(
                          "Invalid mode: {mode_str}. Use octal format (e.g. 644, 755)"
                      ))
                  })?;

                  use cap_std::fs::PermissionsExt;
                  let permissions = cap_std::fs::Permissions::from_mode(mode);
                  resolved.set_permissions(permissions).await?;

                  Ok(json!({
                      "success": true,
                      "path": resolved.canonical.to_string_lossy(),
                      "mode": mode_str,
                  }))
              }

              #[cfg(not(unix))]
              {
                  let _ = (args, config);
                  Err(MCSError::FilesystemError(
                      "Permission changes are not supported on this platform".into(),
                  ))
              }
          }''',
          )

          replace_once(
              "src/actions/compress.rs",
              "            header.set_mode(metadata.permissions().mode());",
              '''            let archive_mode = {
                  #[cfg(unix)]
                  {
                      metadata.permissions().mode()
                  }
                  #[cfg(not(unix))]
                  {
                      if metadata.permissions().readonly() {
                          0o444
                      } else {
                          0o644
                      }
                  }
              };
              header.set_mode(archive_mode);''',
          )

          replace_once(
              "src/validation.rs",
              '''    pub async fn create_symlink(&self, src: &str, link: &str) -> Result<()> {
              let src_abs = canonicalize_or_parent(&normalize_path(&to_abs(src)))?;
              let link_abs = canonicalize_or_parent(&normalize_path(&to_abs(link)))?;

              let _src_root = self
                  .trie
                  .longest_prefix(&src_abs)
                  .ok_or_else(|| MCSError::PathNotAllowed(src.to_string()))?;
              let _link_root = self
                  .trie
                  .longest_prefix(&link_abs)
                  .ok_or_else(|| MCSError::PathNotAllowed(link.to_string()))?;

              #[cfg(unix)]
              {
                  tokio::task::spawn_blocking(move || {
                      std::os::unix::fs::symlink(&src_abs, &link_abs)
                          .map_err(|e| MCSError::FilesystemError(format!("Cannot create symlink: {e}")))
                  })
                  .await
                  .map_err(|e| MCSError::FilesystemError(format!("Symlink task failed: {e}")))?
                  .map_err(|e| MCSError::FilesystemError(format!("Cannot create symlink: {e}")))?;
              }

              #[cfg(windows)]
              {
                  let _ = (src_abs, link_abs);
                  return Err(MCSError::FilesystemError(
                      "Symlinks not supported through sandbox on Windows yet".into(),
                  ));
              }

              Ok(())
          }''',
              '''    pub async fn create_symlink(&self, src: &str, link: &str) -> Result<()> {
              let src_abs = canonicalize_or_parent(&normalize_path(&to_abs(src)))?;
              let link_abs = canonicalize_or_parent(&normalize_path(&to_abs(link)))?;

              let _src_root = self
                  .trie
                  .longest_prefix(&src_abs)
                  .ok_or_else(|| MCSError::PathNotAllowed(src.to_string()))?;
              let _link_root = self
                  .trie
                  .longest_prefix(&link_abs)
                  .ok_or_else(|| MCSError::PathNotAllowed(link.to_string()))?;

              #[cfg(unix)]
              {
                  tokio::task::spawn_blocking(move || {
                      std::os::unix::fs::symlink(&src_abs, &link_abs).map_err(|e| {
                          MCSError::FilesystemError(format!("Cannot create symlink: {e}"))
                      })
                  })
                  .await
                  .map_err(|e| MCSError::FilesystemError(format!("Symlink task failed: {e}")))?
                  .map_err(|e| MCSError::FilesystemError(format!("Cannot create symlink: {e}")))?;
                  Ok(())
              }

              #[cfg(not(unix))]
              {
                  let _ = (src_abs, link_abs);
                  Err(MCSError::FilesystemError(
                      "Symlinks are not supported through the sandbox on this platform".into(),
                  ))
              }
          }''',
          )

          replace_once(
              "src/validation.rs",
              '''fn check_symlinks_in_path(path: &Path) -> std::result::Result<(), ()> {
              let mut current = if path.is_absolute() {
                  PathBuf::from("/")
              } else {
                  return Err(());
              };

              for component in path.components() {
                  match component {
                      Component::RootDir => continue,
                      Component::Prefix(_) => continue,
                      Component::CurDir | Component::ParentDir => return Err(()),
                      Component::Normal(name) => {
                          current.push(name);
                          if current.is_symlink() {
                              return Err(());
                          }
                      }
                  }
              }
              Ok(())
          }''',
              '''fn check_symlinks_in_path(path: &Path) -> std::result::Result<(), ()> {
              if !path.is_absolute() {
                  return Err(());
              }

              let mut current = PathBuf::new();
              for component in path.components() {
                  match component {
                      Component::Prefix(prefix) => current.push(prefix.as_os_str()),
                      Component::RootDir => current.push(component.as_os_str()),
                      Component::CurDir | Component::ParentDir => return Err(()),
                      Component::Normal(name) => {
                          current.push(name);
                          if current.is_symlink() {
                              return Err(());
                          }
                      }
                  }
              }
              Ok(())
          }''',
          )

          replace_once(
              "src/validation.rs",
              '''        let p = Path::new("/nonexistent_dir_xyzabc/nonexistent_file");
              assert!(check_symlinks_in_path(p).is_ok());''',
              '''        let path = std::env::current_dir()
                  .unwrap()
                  .join("nonexistent_dir_xyzabc")
                  .join("nonexistent_file");
              assert!(check_symlinks_in_path(&path).is_ok());''',
          )

          replace_once("Cargo.toml", 'build = "build.rs"\n', "")
          replace_once("Cargo.toml", '"build.rs", ', "")

          replace_once(
              "src/actions/mod.rs",
              '''pub mod args;

          #[cfg(not(windows))]
          pub mod compress;
          #[cfg(windows)]
          pub mod compress {
              include!(concat!(env!("OUT_DIR"), "/compress_windows.rs"));
          }

          pub mod crypto;
          pub mod csv;
          pub mod dirs;

          #[cfg(not(windows))]
          pub mod files;
          #[cfg(windows)]
          pub mod files {
              include!(concat!(env!("OUT_DIR"), "/files_windows.rs"));
          }

          pub mod util;
          ''',
              '''pub mod args;
          pub mod compress;
          pub mod crypto;
          pub mod csv;
          pub mod dirs;
          pub mod files;
          pub mod util;
          ''',
          )

          replace_once(
              "src/lib.rs",
              '''#[cfg(not(windows))]
          pub mod validation;
          #[cfg(windows)]
          pub mod validation {
              include!(concat!(env!("OUT_DIR"), "/validation_windows.rs"));
          }''',
              "pub mod validation;",
          )

          Path("build.rs").unlink()

          Path(".github/workflows/ci.yml").write_text(
              '''name: CI

          on:
            push:
              branches:
                - main
                - codex/windows-compat
            pull_request:

          permissions:
            contents: read

          jobs:
            rust:
              strategy:
                fail-fast: false
                matrix:
                  os:
                    - ubuntu-latest
                    - windows-latest
              runs-on: ${{ matrix.os }}
              steps:
                - uses: actions/checkout@v4
                - uses: dtolnay/rust-toolchain@stable
                  with:
                    components: rustfmt, clippy
                - uses: Swatinem/rust-cache@v2
                - name: Format
                  run: cargo fmt --all -- --check
                - name: Clippy
                  run: cargo clippy --all-targets --all-features
                - name: Test
                  run: cargo test --all-features
                - name: Release build
                  run: cargo build --release
          ''',
              encoding="utf-8",
          )
          PY
          cargo fmt --all
      - name: Commit direct source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: compile filesystem modules natively on Windows"
          git push origin HEAD:codex/windows-compat

  rust:
    if: github.actor == 'github-actions[bot]'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      - name: Test
        run: cargo test --all-features
      - name: Release build
        run: cargo build --release
