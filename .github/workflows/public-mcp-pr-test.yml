name: Public MCP PR protocol test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MCP_URL: https://b24.alwaysdata.net/mcpfs/mcp
      MCP_PROTOCOL: 2025-11-25
    steps:
      - name: Health checks
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 8 --max-time 20 https://b24.alwaysdata.net/mcpfs/health | tee health.json
          jq -e '.status == "ok"' health.json >/dev/null
          curl -fsS --connect-timeout 8 --max-time 20 https://b24.alwaysdata.net/mcpfs/health/backend | tee backend.json
          jq -e '.status == "up" and .backend.transport == "streamable-http"' backend.json >/dev/null

      - name: Initialize session
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 8 --max-time 20 -D init.headers -o init.json \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"github-actions","version":"1.0"}}}' "$MCP_URL"
          sid="$(grep -i '^mcp-session-id:' init.headers | head -1 | cut -d: -f2- | tr -d ' \r')"
          test -n "$sid"
          echo "MCP_SESSION_ID=$sid" >> "$GITHUB_ENV"
          jq -e '.result.protocolVersion == "2025-11-25" and (.result.capabilities.tools != null) and (.result.capabilities.resources != null)' init.json >/dev/null
          jq '{protocolVersion:.result.protocolVersion,server:.result.serverInfo,capabilities:.result.capabilities}' init.json
          echo "session=${sid:0:8}..."

      - name: Initialized notification
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --connect-timeout 8 --max-time 20 -o notify.body -w '%{http_code}' \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -H "MCP-Session-Id: $MCP_SESSION_ID" -H "MCP-Protocol-Version: $MCP_PROTOCOL" \
            --data '{"jsonrpc":"2.0","method":"notifications/initialized"}' "$MCP_URL")"
          echo "http=$code body=$(cat notify.body)"
          case "$code" in 200|202|204) ;; *) exit 1;; esac

      - name: List tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 8 --max-time 20 -o tools.json \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -H "MCP-Session-Id: $MCP_SESSION_ID" -H "MCP-Protocol-Version: $MCP_PROTOCOL" \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' "$MCP_URL"
          jq -e '.result.tools | type == "array" and length > 0' tools.json >/dev/null
          jq '{toolCount:(.result.tools|length),toolNames:(.result.tools|map(.name))}' tools.json

      - name: Call list_allowed_directories
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 8 --max-time 20 -o tool-call.json \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -H "MCP-Session-Id: $MCP_SESSION_ID" -H "MCP-Protocol-Version: $MCP_PROTOCOL" \
            --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"list_allowed_directories","arguments":{}}}' "$MCP_URL"
          jq -e '.result.isError != true' tool-call.json >/dev/null
          jq '{isError:.result.isError,content:.result.content,structuredContent:.result.structuredContent}' tool-call.json

      - name: List resources
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 8 --max-time 20 -o resources.json \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -H "MCP-Session-Id: $MCP_SESSION_ID" -H "MCP-Protocol-Version: $MCP_PROTOCOL" \
            --data '{"jsonrpc":"2.0","id":4,"method":"resources/list"}' "$MCP_URL"
          jq -e '.result.resources | type == "array" and any(.uri == "ui://filesystem/browser-v1.html")' resources.json >/dev/null
          jq '{resourceCount:(.result.resources|length),resourceUris:(.result.resources|map(.uri)|.[0:10])}' resources.json

      - name: Read MCP Apps UI resource
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 8 --max-time 20 -o resource-read.json \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -H "MCP-Session-Id: $MCP_SESSION_ID" -H "MCP-Protocol-Version: $MCP_PROTOCOL" \
            --data '{"jsonrpc":"2.0","id":5,"method":"resources/read","params":{"uri":"ui://filesystem/browser-v1.html"}}' "$MCP_URL"
          jq -e '.result.contents[0].mimeType | startswith("text/html")' resource-read.json >/dev/null
          jq '{uri:.result.contents[0].uri,mimeType:.result.contents[0].mimeType,textBytes:(.result.contents[0].text|length)}' resource-read.json

      - name: Open SSE stream
        shell: bash
        run: |
          set -euo pipefail
          set +e
          curl -sS --no-buffer --connect-timeout 8 --max-time 8 -D sse.headers -o sse.body \
            -H 'Accept: text/event-stream' \
            -H "MCP-Session-Id: $MCP_SESSION_ID" -H "MCP-Protocol-Version: $MCP_PROTOCOL" \
            "$MCP_URL"
          rc=$?
          set -e
          code="$(awk '/^HTTP\// {code=$2} END {print code}' sse.headers)"
          type="$(grep -i '^content-type:' sse.headers | tail -1 | cut -d: -f2- | tr -d '\r' | xargs)"
          echo "http=$code type=$type curl_rc=$rc bytes=$(wc -c < sse.body)"
          test "$code" = 200
          [[ "$type" == text/event-stream* ]]
          test "$rc" -eq 0 -o "$rc" -eq 28

      - name: Delete session
        if: always() && env.MCP_SESSION_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --connect-timeout 8 --max-time 20 -o delete.body -w '%{http_code}' -X DELETE \
            -H "MCP-Session-Id: $MCP_SESSION_ID" -H "MCP-Protocol-Version: $MCP_PROTOCOL" "$MCP_URL")"
          echo "http=$code body=$(cat delete.body)"
          test "$code" = 204
