name: Apply Windows compatibility fix

on:
  push:
    branches:
      - codex/windows-compat
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/windows-compat
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch platform-specific filesystem code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected source fragment not found in {path}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/actions/files.rs",
              '    let permissions = format!("{:o}", cap_meta.permissions().mode() & 0o777);\n',
              '''    #[cfg(unix)]
              let permissions = Some(format!("{:o}", cap_meta.permissions().mode() & 0o777));
              #[cfg(not(unix))]
              let permissions: Option<String> = None;
              ''',
          )

          replace_once(
              "src/actions/files.rs",
              '''pub async fn set_permissions(args: Option<&Value>, config: &Config) -> Result<Value> {
                  let path = get_str_arg(args, "path")?;
                  let mode_str = get_str_arg(args, "mode")?;
                  let resolved = config.sandbox().resolve(&path)?;

                  let mode = u32::from_str_radix(&mode_str, 8).map_err(|_| {
                      MCSError::InvalidParams(format!(
                          "Invalid mode: {mode_str}. Use octal format (e.g. 644, 755)"
                      ))
                  })?;

                  #[cfg(unix)]
                  {
                      use cap_std::fs::PermissionsExt;
                      let perm = cap_std::fs::Permissions::from_mode(mode);
                      resolved.set_permissions(perm).await?;
                  }

                  #[cfg(not(unix))]
                  {
                      let _ = (mode, &resolved);
                      return Err(MCSError::FilesystemError(
                          "Permission changes are not supported on this platform".into(),
                      ));
                  }

                  Ok(json!({ "success": true, "path": resolved.canonical.to_string_lossy(), "mode": mode_str }))
              }
              ''',
              '''pub async fn set_permissions(args: Option<&Value>, config: &Config) -> Result<Value> {
                  #[cfg(unix)]
                  {
                      let path = get_str_arg(args, "path")?;
                      let mode_str = get_str_arg(args, "mode")?;
                      let resolved = config.sandbox().resolve(&path)?;
                      let mode = u32::from_str_radix(&mode_str, 8).map_err(|_| {
                          MCSError::InvalidParams(format!(
                              "Invalid mode: {mode_str}. Use octal format (e.g. 644, 755)"
                          ))
                      })?;

                      use cap_std::fs::PermissionsExt;
                      let permissions = cap_std::fs::Permissions::from_mode(mode);
                      resolved.set_permissions(permissions).await?;

                      Ok(json!({
                          "success": true,
                          "path": resolved.canonical.to_string_lossy(),
                          "mode": mode_str,
                      }))
                  }

                  #[cfg(not(unix))]
                  {
                      let _ = (args, config);
                      Err(MCSError::FilesystemError(
                          "Permission changes are not supported on this platform".into(),
                      ))
                  }
              }
              ''',
          )

          replace_once(
              "src/actions/compress.rs",
              '            header.set_mode(metadata.permissions().mode());\n',
              '''            let archive_mode = {
                              #[cfg(unix)]
                              {
                                  metadata.permissions().mode()
                              }
                              #[cfg(not(unix))]
                              {
                                  if metadata.permissions().readonly() {
                                      0o444
                                  } else {
                                      0o644
                                  }
                              }
                          };
                          header.set_mode(archive_mode);
              ''',
          )

          replace_once(
              "src/validation.rs",
              '''        #[cfg(unix)]
                      {
                          tokio::task::spawn_blocking(move || {
                              std::os::unix::fs::symlink(&src_abs, &link_abs)
                                  .map_err(|e| MCSError::FilesystemError(format!("Cannot create symlink: {e}")))
                          })
                          .await
                          .map_err(|e| MCSError::FilesystemError(format!("Symlink task failed: {e}")))?
                          .map_err(|e| MCSError::FilesystemError(format!("Cannot create symlink: {e}")))?;
                      }

                      #[cfg(windows)]
                      {
                          let _ = (src_abs, link_abs);
                          return Err(MCSError::FilesystemError(
                              "Symlinks not supported through sandbox on Windows yet".into(),
                          ));
                      }

                      Ok(())
              ''',
              '''        #[cfg(unix)]
                      {
                          tokio::task::spawn_blocking(move || {
                              std::os::unix::fs::symlink(&src_abs, &link_abs)
                                  .map_err(|e| MCSError::FilesystemError(format!("Cannot create symlink: {e}")))
                          })
                          .await
                          .map_err(|e| MCSError::FilesystemError(format!("Symlink task failed: {e}")))?
                          .map_err(|e| MCSError::FilesystemError(format!("Cannot create symlink: {e}")))?;
                          Ok(())
                      }

                      #[cfg(not(unix))]
                      {
                          let _ = (src_abs, link_abs);
                          Err(MCSError::FilesystemError(
                              "Symlinks are not supported through the sandbox on this platform".into(),
                          ))
                      }
              ''',
          )

          Path(".github/workflows/ci.yml").write_text(
              '''name: CI

          on:
            push:
              branches:
                - main
                - codex/windows-compat
            pull_request:

          permissions:
            contents: read

          jobs:
            rust:
              strategy:
                fail-fast: false
                matrix:
                  os:
                    - ubuntu-latest
                    - windows-latest
              runs-on: ${{ matrix.os }}
              steps:
                - uses: actions/checkout@v4
                - uses: dtolnay/rust-toolchain@stable
                  with:
                    components: rustfmt, clippy
                - uses: Swatinem/rust-cache@v2
                - name: Format
                  run: cargo fmt --all -- --check
                - name: Clippy
                  run: cargo clippy --all-targets --all-features
                - name: Test
                  run: cargo test --all-features
                - name: Release build
                  run: cargo build --release
          ''',
              encoding="utf-8",
          )
          PY
          cargo fmt --all
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/actions/files.rs src/actions/compress.rs src/validation.rs .github/workflows/ci.yml
          git commit -m "fix: restore Windows compilation"
          git push origin HEAD:codex/windows-compat
