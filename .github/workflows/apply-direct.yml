name: Apply direct Windows fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/windows-compat
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Extract source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          marker = "python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          Path('/tmp/direct_patch.py').write_text(
              dedent(workflow[start:end]),
              encoding='utf-8',
          )
          PY
      - name: Execute source patch
        id: patch
        shell: bash
        run: |
          set +e
          python3 /tmp/direct_patch.py > /tmp/direct-patch.log 2>&1
          status=$?
          cat /tmp/direct-patch.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload patch diagnostics
        if: steps.patch.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: direct-patch-log
          path: |
            /tmp/direct-patch.log
            /tmp/direct_patch.py
      - name: Fail on patch error
        if: steps.patch.outputs.exit_code != '0'
        run: exit 1
      - name: Format direct patch
        if: steps.patch.outputs.exit_code == '0'
        shell: bash
        run: |
          rm -f .github/workflows/apply-direct.yml
          cargo fmt --all
      - name: Commit direct source patch
        if: steps.patch.outputs.exit_code == '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: compile filesystem modules natively on Windows"
          git push origin HEAD:codex/windows-compat
