name: Public MCP endpoint diagnostics

on:
  push:
    branches: [codex/public-mcp-endpoint-test]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: DNS
        run: |
          getent ahosts b24.alwaysdata.net || true
          getent ahosts services-b24.alwaysdata.net || true
      - name: TLS handshake
        run: timeout 15 openssl s_client -connect b24.alwaysdata.net:443 -servername b24.alwaysdata.net -brief </dev/null || true
      - name: Website root
        run: curl -v --connect-timeout 10 --max-time 20 https://b24.alwaysdata.net/ -o /dev/null || true
      - name: Proxy health
        run: curl -v --connect-timeout 10 --max-time 20 https://b24.alwaysdata.net/mcpfs/health -o health.body || true; test -f health.body && cat health.body || true
      - name: MCP initialize
        run: |
          curl -v --connect-timeout 10 --max-time 25 \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"github-actions-diagnostics","version":"1.0"}}}' \
            https://b24.alwaysdata.net/mcpfs/mcp -o initialize.body || true
          test -f initialize.body && cat initialize.body || true
