name: Public MCP full protocol test

on:
  push:
    branches: [codex/public-mcp-endpoint-test]

permissions:
  contents: read

jobs:
  endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test complete MCP flow
        shell: bash
        env:
          MCP_URL: https://b24.alwaysdata.net/mcpfs/mcp
          HEALTH_URL: https://b24.alwaysdata.net/mcpfs/health
          BACKEND_HEALTH_URL: https://b24.alwaysdata.net/mcpfs/health/backend
        run: |
          set -euo pipefail

          echo '== health =='
          curl -fsS --connect-timeout 8 --max-time 20 "$HEALTH_URL" | tee health.json
          jq -e '.status == "ok"' health.json >/dev/null
          curl -fsS --connect-timeout 8 --max-time 20 "$BACKEND_HEALTH_URL" | tee backend.json
          jq -e '.status == "up" and .backend.transport == "streamable-http"' backend.json >/dev/null

          echo '== initialize =='
          curl -fsS --connect-timeout 8 --max-time 20 \
            -D init.headers -o init.json \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"github-actions-full-test","version":"1.0"}}}' \
            "$MCP_URL"
          SESSION_ID="$(grep -i '^mcp-session-id:' init.headers | head -1 | cut -d: -f2- | tr -d ' \r')"
          test -n "$SESSION_ID"
          jq -e '.result.protocolVersion == "2025-11-25" and .result.capabilities.tools != null and .result.capabilities.resources != null' init.json >/dev/null
          jq '{protocolVersion:.result.protocolVersion,server:.result.serverInfo.name,version:.result.serverInfo.version,capabilities:.result.capabilities}' init.json
          echo "session=${SESSION_ID:0:8}..."

          echo '== initialized notification =='
          notify_code="$(curl -sS --connect-timeout 8 --max-time 20 -o notify.body -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H "MCP-Session-Id: $SESSION_ID" \
            -H 'MCP-Protocol-Version: 2025-11-25' \
            --data '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            "$MCP_URL")"
          echo "notification_http=$notify_code"
          case "$notify_code" in 200|202|204) ;; *) cat notify.body; exit 1;; esac

          echo '== tools/list =='
          curl -fsS --connect-timeout 8 --max-time 20 -o tools.json \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H "MCP-Session-Id: $SESSION_ID" \
            -H 'MCP-Protocol-Version: 2025-11-25' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            "$MCP_URL"
          jq -e '.result.tools | type == "array" and length > 0' tools.json >/dev/null
          jq '{toolCount:(.result.tools|length),toolNames:(.result.tools|map(.name))}' tools.json

          echo '== tools/call list_allowed_directories =='
          curl -fsS --connect-timeout 8 --max-time 20 -o call.json \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H "MCP-Session-Id: $SESSION_ID" \
            -H 'MCP-Protocol-Version: 2025-11-25' \
            --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"list_allowed_directories","arguments":{}}}' \
            "$MCP_URL"
          jq -e '.result.isError != true' call.json >/dev/null
          jq '{isError:.result.isError,content:.result.content,structuredContent:.result.structuredContent}' call.json

          echo '== resources/list =='
          curl -fsS --connect-timeout 8 --max-time 20 -o resources.json \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H "MCP-Session-Id: $SESSION_ID" \
            -H 'MCP-Protocol-Version: 2025-11-25' \
            --data '{"jsonrpc":"2.0","id":4,"method":"resources/list"}' \
            "$MCP_URL"
          jq -e '.result.resources | type == "array" and length > 0' resources.json >/dev/null
          jq -e '.result.resources | any(.uri == "ui://filesystem/browser-v1.html")' resources.json >/dev/null
          jq '{resourceCount:(.result.resources|length),resourceUris:(.result.resources|map(.uri)|.[0:10])}' resources.json

          echo '== resources/read UI =='
          curl -fsS --connect-timeout 8 --max-time 20 -o resource-read.json \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H "MCP-Session-Id: $SESSION_ID" \
            -H 'MCP-Protocol-Version: 2025-11-25' \
            --data '{"jsonrpc":"2.0","id":5,"method":"resources/read","params":{"uri":"ui://filesystem/browser-v1.html"}}' \
            "$MCP_URL"
          jq -e '.result.contents[0].mimeType | startswith("text/html")' resource-read.json >/dev/null
          jq '{uri:.result.contents[0].uri,mimeType:.result.contents[0].mimeType,textBytes:(.result.contents[0].text|length)}' resource-read.json

          echo '== GET SSE =='
          set +e
          curl -sS --no-buffer --connect-timeout 8 --max-time 6 \
            -D sse.headers -o sse.body \
            -H 'Accept: text/event-stream' \
            -H "MCP-Session-Id: $SESSION_ID" \
            -H 'MCP-Protocol-Version: 2025-11-25' \
            "$MCP_URL"
          sse_rc=$?
          set -e
          sse_code="$(awk '/^HTTP\// {code=$2} END {print code}' sse.headers)"
          sse_type="$(grep -i '^content-type:' sse.headers | tail -1 | cut -d: -f2- | tr -d '\r' | xargs)"
          echo "sse_http=$sse_code sse_type=$sse_type curl_rc=$sse_rc bytes=$(wc -c < sse.body)"
          test "$sse_code" = 200
          [[ "$sse_type" == text/event-stream* ]]
          test "$sse_rc" -eq 0 -o "$sse_rc" -eq 28

          echo '== DELETE session =='
          delete_code="$(curl -sS --connect-timeout 8 --max-time 20 -o delete.body -w '%{http_code}' \
            -X DELETE \
            -H "MCP-Session-Id: $SESSION_ID" \
            -H 'MCP-Protocol-Version: 2025-11-25' \
            "$MCP_URL")"
          echo "delete_http=$delete_code"
          test "$delete_code" = 204

          echo 'ALL MCP CHECKS PASSED'
