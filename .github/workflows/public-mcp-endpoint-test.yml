name: Public MCP endpoint test

on:
  push:
    branches:
      - codex/public-mcp-endpoint-test
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test MCP Streamable HTTP endpoint
        env:
          MCP_URL: https://b24.alwaysdata.net/mcpfs/mcp
          HEALTH_URL: https://b24.alwaysdata.net/mcpfs/health
          BACKEND_HEALTH_URL: https://b24.alwaysdata.net/mcpfs/health/backend
        run: bash scripts/test-public-mcp.sh
